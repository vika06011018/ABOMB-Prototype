<head>
<meta charset="utf-8">

<title>BOMB｜加入手機主畫面</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#180d20;color:#fff1f9;font:16px/1.55 system-ui,"Microsoft JhengHei",sans-serif}
button,a{font:inherit;color:inherit}
a{color:#f5cd83;text-decoration:none}
button{cursor:pointer}
:focus-visible{outline:2px solid #ffd17e;outline-offset:3px}
main{width:min(100% - 32px,620px);margin:auto;padding:26px 0 66px}
header{padding:25px 0 16px}
.brand{display:flex;align-items:center;gap:12px;color:#f4cd87;font-weight:700}
.brand img{width:40px;height:40px}
h1{font-size:clamp(29px,7vw,44px);line-height:1.15;margin:18px 0 9px}
header p,.guide-note{margin:0;color:#d6becf}
nav{display:flex;gap:20px;margin:18px 0 0}
.tutorial{scroll-margin-top:14px;margin-top:25px;padding:20px 9px;border:1px solid #61435e;border-radius:21px;background:#281730;text-align:center}
.tutorial h2{margin:0 0 15px;font-size:20px;color:#f5cd83}
.stage{display:grid;grid-template-columns:minmax(34px,1fr) minmax(0,240px) minmax(34px,1fr);align-items:center}
.arrow{justify-self:center;width:36px;height:36px;border:1px solid #87607a;border-radius:50%;background:#3c2640;font-size:23px;line-height:1}
.arrow:disabled{opacity:.28;cursor:default}
.phone{height:484px;position:relative;overflow:hidden;border:5px solid #9c828b;outline:1px solid #130a16;border-radius:29px;background:#160d1e}
.screen{position:absolute;inset:23px 0 35px;overflow:hidden}
.screen iframe{width:390px;height:720px;transform:scale(var(--preview-scale,.59));transform-origin:top left;border:0;pointer-events:none}
.status,.browser-bar{position:absolute;left:0;right:0;background:#f0e6ee;color:#2c1d30;font-size:11px;display:flex;align-items:center;padding:0 12px;z-index:1}
.status{height:23px;top:0;justify-content:space-between}
.browser-bar{height:35px;bottom:0;justify-content:space-between}
[data-os="android"] .browser-bar{bottom:auto;top:23px}
[data-os="android"] .screen{top:58px;bottom:0}
.trigger{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:18px}
.trigger svg{width:18px;height:18px;display:block}
.phone[data-step="0"] .trigger{outline:3px solid #efa33f;background:#ffe3b0}
.overlay{position:absolute;z-index:2;inset:0;display:grid;align-content:end;padding:14px;background:#10061888}
.overlay[hidden]{display:none}
.sheet{background:#f7eef5;color:#2d1a30;border-radius:14px;padding:16px 10px;text-align:left;font-size:13px}
.sheet p{margin:0 0 12px;font-weight:700}
.sheet strong{display:block;padding:9px 5px;border:2px solid #dc8f29;border-radius:7px;background:#ffebca}
.complete-phone{display:block;width:100%;height:484px;object-fit:contain}
.complete-phone[hidden]{display:none}
.dots{display:flex;justify-content:center;gap:4px;margin:9px 0 7px}
.dot{width:30px;height:28px;padding:0;border:0;background:none;display:grid;place-items:center}
.dot::before{content:"";height:8px;width:8px;background:#bd9db6;border-radius:20px}
.dot[aria-current="step"]::before{width:20px;background:#f0bf71}
.caption{min-height:77px;max-width:320px;margin:0 auto;padding:0 10px}
.caption strong{display:block;color:#f5cd83}
.caption p{margin:4px 0 0}
.guide-note{margin-top:21px;font-size:14px}
</style>
<link rel="stylesheet" href="bomb-final.css?v=44">
<style>.floating{display:none}
@media(min-width:900px){
.floating{position:fixed;display:grid;justify-items:center;gap:8px;right:24px;bottom:44px;z-index:90;touch-action:none}
.floating[style*="top:"]{bottom:auto}
#floatActions{display:grid;gap:7px}
#floatActions[hidden]{display:none}
#floatActions button,#floatToggle{cursor:pointer;color:white;background:#561b46;border:1px solid #f7cbef;border-radius:14px;padding:6px;min-width:80px}
#floatActions button{display:grid;justify-items:center;gap:4px}
#floatActions svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.7}
#floatToggle.is-collapsed{width:100px;padding:0;background:transparent;border:0}
.float-gift-icon{width:100%;display:block;pointer-events:none}
}
#bombQuickPanel{position:fixed;z-index:92;width:min(340px,calc(100vw - 100px));max-height:calc(100dvh - 30px);overflow:auto;padding:15px 14px 13px;border:1.5px solid #f3a9e4;border-radius:18px;background:linear-gradient(155deg,#501238 0%,#300b2a 70%,#27051e 100%);box-shadow:0 0 15px #ff5ce484, inset 0 0 16px #ff74c01f;color:#fff6e7;font-family:inherit}
#bombQuickPanel[hidden]{display:none!important}
#bombQuickPanel *{box-sizing:border-box}
.bqp-head{display:flex;gap:10px;align-items:center;padding-right:22px;margin-bottom:10px}
.bqp-icon{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid #f2bc75;border-radius:12px;background:linear-gradient(145deg,#7f1b55,#3e0a35);box-shadow:0 0 9px #f991a077;font-size:22px}
.bqp-title{font-size:19px;font-weight:800;color:#ffd75c}.bqp-sub{font-size:11px;color:#efd5e6;line-height:1.7;margin-top:4px}
.bqp-close{position:absolute;top:8px;right:10px;color:#ffe286;background:none;border:0;font-size:22px;cursor:pointer;line-height:1;padding:3px}
.bqp-items{display:grid;gap:7px;margin-top:11px}
.bqp-item{display:flex;gap:10px;align-items:center;width:100%;border:1px solid #a05283;border-radius:11px;padding:10px 11px;color:#ffe58c;text-align:left;background:#5b204a73;cursor:pointer;font:inherit;min-height:52px}
.bqp-item:hover,.bqp-item:focus-visible{background:#74345b;border-color:#ffd77e;outline:none}
.bqp-num{display:grid;place-items:center;flex:none;width:23px;height:23px;color:#281007;font-weight:800;font-size:12px;border-radius:50%;background:linear-gradient(#fff29f,#ffc51e)}
.bqp-rowtext{display:flex;flex-direction:column;gap:2px;flex:1}.bqp-rowtext strong{font-size:14px}.bqp-rowtext small{color:#d9aecb;font-size:10px}.bqp-chevron{font-size:17px;color:#ffe270}
.bqp-cta{display:block;width:100%;margin-top:11px;padding:10px 14px;border:0;border-radius:999px;background:linear-gradient(#fff7b2,#ffd43a 55%,#ec9d09);box-shadow:0 3px 11px #ffac4891;color:#2b1700;font-weight:900;font-size:15px;cursor:pointer}
.bqp-foot{margin:8px 0 0;text-align:center;font-size:10px;color:#b989ad}
@media(max-width:899px){#bombQuickPanel{display:none!important}}

</style>

<body>

<main>
<a href="index.html">‹ 返回 BOMB 首頁</a>
<header id="install-guides">
<div class="brand"><img src="assets/app_logo.png" alt="">BOMB 娛樂平台</div>
<h1>加入手機主畫面</h1>
<p>依手機系統查看圖解，將 BOMB 網頁加到主畫面。</p>
<nav aria-label="系統教學"><a href="#ios">iPhone 安裝教學</a><a href="#android">Android 安裝教學</a></nav>
</header>
<div id="tutorials"></div>
<p class="guide-note">圖中瀏覽器按鈕與選單為操作示意，實際位置及名稱依系統版本而異。請在手機瀏覽器開啟 BOMB 首頁，再照步驟操作。</p>
</main>
<script>
const guides = [
  { id:'ios', title:'iPhone／Safari 安裝教學', browser:'Safari', trigger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10H5v11h14V10h-3m-4 6V3m-4 4 4-4 4 4"/></svg>', steps:[
    ['用 Safari 開啟 BOMB 首頁，點「分享」。'],
    ['在分享選單往下找，點「加入主畫面」。','Safari 分享選單','＋ 加入主畫面'],
    ['確認名稱後點「加入」。如有「以網頁 App 開啟」選項，可先開啟。','加入主畫面','加入'],
    ['回到手機主畫面，點 BOMB 圖示即可開啟網頁。']
  ]},
  { id:'android', title:'Android／Chrome 安裝教學', browser:'Chrome', trigger:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>', steps:[
    ['用 Chrome 開啟 BOMB 首頁，點右上角三點選單。'],
    ['在選單中點「加到主畫面」。','Chrome 選單','＋ 加到主畫面'],
    ['選擇「建立捷徑」，再確認新增。','加到主畫面','建立捷徑'],
    ['回到手機主畫面，點 BOMB 圖示即可開啟網頁。']
  ]}
];

for (const guide of guides) {
  const section=document.createElement('section');
  section.className='tutorial';
  section.id=guide.id;
  section.dataset.os=guide.id;
  section.innerHTML=`
    <h2>${guide.title}</h2>
    <div class="stage">
      <button class="arrow previous" type="button" aria-label="上一步">‹</button>
      <div class="phone" data-step="0">
        <div class="status" aria-hidden="true"><span>09:41</span><span>▰</span></div>
        <div class="screen" inert><iframe src="index.html?preview=app-guide" title="BOMB 手機版首頁" loading="lazy" tabindex="-1"></iframe></div>
        <div class="browser-bar" aria-hidden="true"><span>${guide.browser} · BOMB</span><span class="trigger">${guide.trigger}</span></div>
        <div class="overlay" hidden><div class="sheet"><p></p><strong></strong></div></div>

      </div>
      <img class="complete-phone" src="assets/app-guide/${guide.id}-home-screen.png" alt="${guide.title}完成畫面，BOMB 捷徑已出現在手機主畫面" loading="lazy" hidden>
      <button class="arrow next" type="button" aria-label="下一步">›</button>
    </div>
    <div class="dots">${guide.steps.map((_,i)=>`<button type="button" class="dot" data-step="${i}" aria-label="步驟 ${i+1}"></button>`).join('')}</div>
    <div class="caption" aria-live="polite"><strong></strong><p></p></div>`;
  const find=selector=>section.querySelector(selector);
  const dots=[...section.querySelectorAll('.dot')];
  const preview=find('.screen');
  new ResizeObserver(([entry]) => {
    preview.style.setProperty('--preview-scale', entry.contentRect.width / 390);
  }).observe(preview);
  let step=0;
  function render(index) {
    step=index;
    const [text, title, item]=guide.steps[step];
    find('.phone').dataset.step=step;
    find('.previous').disabled=step===0;
    find('.next').disabled=step===guide.steps.length-1;
    find('.overlay').hidden=!title;
    find('.sheet p').textContent=title||'';
    find('.sheet strong').textContent=item||'';
    const complete=step===guide.steps.length-1;
    find('.phone').hidden=complete;
    find('.complete-phone').hidden=!complete;
    find('.caption strong').textContent=`步驟 ${step+1}／${guide.steps.length}`;
    find('.caption p').textContent=text;
    dots.forEach((dot,i)=>dot.setAttribute('aria-current',i===step?'step':'false'));
  }
  find('.previous').addEventListener('click',()=>render(step-1));
  find('.next').addEventListener('click',()=>render(step+1));
  dots.forEach((dot,i)=>dot.addEventListener('click',()=>render(i)));
  render(0);
  document.getElementById('tutorials').append(section);
}
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>

<script>
function showModal(title,message) {
  const panel = document.querySelector('#guide-tools-dialog');

  panel.querySelector('p').textContent = message;
  panel.showModal();
}
