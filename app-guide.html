<script id="bomb-site-theme-js">
(() => {
  const key = 'bomb-site-settings';
  const themes = new Set(['original', 'red', 'navy', 'indigo', 'bronze', 'white', 'gold']);
  let settings = { theme: 'original', volume: 100, haptics: false };

  function restore() {
    try {
      const stored = JSON.parse(localStorage.getItem(key));
      if (!stored) return;
      const theme = { d:'white', e:'white', f:'bronze', g:'white', h:'gold' }[stored.theme] ?? stored.theme;
      settings = {
        theme: themes.has(theme) ? theme : 'original',
        volume: Number.isInteger(stored.volume) && stored.volume >= 0 && stored.volume <= 100 ? stored.volume : 100,
        haptics: stored.haptics === true
      };
    } catch { /* Use the current settings when storage is unavailable. */ }
  }

  function applyTheme() {
    if (settings.theme === 'original') delete document.documentElement.dataset.siteTheme;
    else document.documentElement.dataset.siteTheme = settings.theme;
  }

  function applyVolume() {
    for (const media of document.querySelectorAll('audio,video')) {
      media.volume = settings.volume / 100;
    }
  }

  restore();
  applyTheme();
  const initControls = () => {
    const volume = document.querySelector('#site-volume');
    const volumeOutput = document.querySelector('#site-volume-value');
    const haptics = document.querySelector('#site-haptics');
    const status = document.querySelector('#site-haptic-status');

    function refresh() {
      applyTheme();
      applyVolume();
      for (const option of document.querySelectorAll('[name="site-theme"]')) {
        option.checked = option.value === settings.theme;
      }
      if (volume) {
        volume.value = settings.volume;
        volumeOutput.textContent = settings.volume + '%';
      }
      if (haptics) haptics.checked = settings.haptics;
    }

    function save() {
      try { localStorage.setItem(key, JSON.stringify(settings)); }
      catch { /* Preferences still work in the current page. */ }
      refresh();
    }

    document.querySelector('#site-theme-options')?.addEventListener('change', event => {
      if (!event.target.matches('[name="site-theme"]')) return;
      settings.theme = event.target.value;
      save();
    });
    volume?.addEventListener('input', () => {
      settings.volume = Number(volume.value);
      save();
    });
    let audioContext;
    document.querySelector('#site-volume-test')?.addEventListener('click', async () => {
      if (!window.AudioContext || settings.volume === 0) return;
      try {
        audioContext ??= new AudioContext();
        await audioContext.resume();
        const now = audioContext.currentTime;
        const tone = audioContext.createOscillator();
        const level = audioContext.createGain();
        tone.frequency.value = 520;
        level.gain.setValueAtTime(0, now);
        level.gain.linearRampToValueAtTime(settings.volume / 100 * 0.12, now + 0.03);
        level.gain.linearRampToValueAtTime(0, now + 0.28);
        tone.connect(level).connect(audioContext.destination);
        tone.start(now);
        tone.stop(now + 0.28);
      } catch { /* Sound preview is optional on browsers that block audio. */ }
    });
    haptics?.addEventListener('change', () => {
      settings.haptics = haptics.checked;
      save();
      if (settings.haptics && !navigator.vibrate?.(18)) {
        status.textContent = '此瀏覽器目前無法播放震動。';
      } else {
        status.textContent = '';
      }
    });
    document.addEventListener('click', event => {
      if (!settings.haptics || !matchMedia('(max-width:899px) and (pointer:coarse)').matches) return;
      if (!event.target.closest('button:not(:disabled),a[href],.deposit-tile')) return;
      navigator.vibrate?.(12);
    });
    document.addEventListener('play', event => {
      if (event.target.matches('audio,video')) event.target.volume = settings.volume / 100;
    }, true);
    window.addEventListener('storage', event => {
      if (event.key !== key) return;
      restore();
      refresh();
    });
    window.addEventListener('pageshow', () => {
      restore();
      refresh();
    });
    refresh();
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initControls, { once:true });
  else initControls();
})();
</script>

<script>
const guides = [
  { id:'ios', title:'iPhone／Safari 安裝教學', browser:'Safari', trigger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10H5v11h14V10h-3m-4 6V3m-4 4 4-4 4 4"/></svg>', steps:[
    ['用 Safari 開啟 BOMB 首頁，點「分享」。'],
    ['在分享選單往下找，點「加入主畫面」。','Safari 分享選單','＋ 加入主畫面'],
    ['確認名稱後點「加入」。如有「以網頁 App 開啟」選項，可先開啟。','加入主畫面','加入'],
    ['回到手機主畫面，點 BOMB 圖示即可開啟網頁。']
  ]},
  { id:'android', title:'Android／Chrome 安裝教學', browser:'Chrome', trigger:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>', steps:[
    ['用 Chrome 開啟 BOMB 首頁，點右上角三點選單。'],
    ['在選單中點「加到主畫面」。','Chrome 選單','＋ 加到主畫面'],
    ['選擇「建立捷徑」，再確認新增。','加到主畫面','建立捷徑'],
    ['回到手機主畫面，點 BOMB 圖示即可開啟網頁。']
  ]}
];

for (const guide of guides) {
  const section=document.createElement('section');
  section.className='tutorial';
  section.id=guide.id;
  section.dataset.os=guide.id;
  section.innerHTML=`
    <h2>${guide.title}</h2>
    <div class="stage">
      <button class="arrow previous" type="button" aria-label="上一步">‹</button>
      <div class="phone" data-step="0">
        <div class="status" aria-hidden="true"><span>09:41</span><span>▰</span></div>
        <div class="screen" inert><iframe src="index.html?preview=app-guide" title="BOMB 手機版首頁" loading="lazy" tabindex="-1"></iframe></div>
        <div class="browser-bar" aria-hidden="true"><span>${guide.browser} · BOMB</span><span class="trigger">${guide.trigger}</span></div>
        <div class="overlay" hidden><div class="sheet"><p></p><strong></strong></div></div>

      </div>
      <img class="complete-phone" src="assets/app-guide/${guide.id}-home-screen.png" alt="${guide.title}完成畫面，BOMB 捷徑已出現在手機主畫面" loading="lazy" hidden>
      <button class="arrow next" type="button" aria-label="下一步">›</button>
    </div>
    <div class="dots">${guide.steps.map((_,i)=>`<button type="button" class="dot" data-step="${i}" aria-label="步驟 ${i+1}"></button>`).join('')}</div>
    <div class="caption" aria-live="polite"><strong></strong><p></p></div>`;
  const find=selector=>section.querySelector(selector);
  const dots=[...section.querySelectorAll('.dot')];
  const preview=find('.screen');
  new ResizeObserver(([entry]) => {
    preview.style.setProperty('--preview-scale', entry.contentRect.width / 390);
  }).observe(preview);
  let step=0;
  function render(index) {
    step=index;
    const [text, title, item]=guide.steps[step];
    find('.phone').dataset.step=step;
    find('.previous').disabled=step===0;
    find('.next').disabled=step===guide.steps.length-1;
    find('.overlay').hidden=!title;
    find('.sheet p').textContent=title||'';
    find('.sheet strong').textContent=item||'';
    const complete=step===guide.steps.length-1;
    find('.phone').hidden=complete;
    find('.complete-phone').hidden=!complete;
    find('.caption strong').textContent=`步驟 ${step+1}／${guide.steps.length}`;
    find('.caption p').textContent=text;
    dots.forEach((dot,i)=>dot.setAttribute('aria-current',i===step?'step':'false'));
  }
  find('.previous').addEventListener('click',()=>render(step-1));
  find('.next').addEventListener('click',()=>render(step+1));
  dots.forEach((dot,i)=>dot.addEventListener('click',()=>render(i)));
  render(0);
  document.getElementById('tutorials').append(section);
}
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>

<style id="bomb-site-theme-css">
#settingsView .settings-back { display:none; }
.settings-panel {
  margin:14px 0; padding:clamp(12px,2vw,22px); border:1px solid #8a6650;
  border-radius:12px; background:#281629; color:#fff0d8;
}
.settings-panel h2 { margin:0 0 14px; font-size:18px; }
.settings-options {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));
  gap:10px; padding:0; margin:0; border:0; min-inline-size:0;
}
.settings-option { position:relative; display:grid; gap:6px; cursor:pointer; }
.settings-option input { position:absolute; inset:0; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
.settings-option span {
  display:grid; gap:5px; align-content:start; height:100%; padding:7px;
  border:1px solid #a089756e; border-radius:8px; font-weight:650;
}
.settings-option small { font-size:12px; font-weight:500; }
.settings-option input:checked + span { outline:2px solid #d4a65d; outline-offset:-2px; }
.settings-option input:focus-visible + span { outline:2px solid #b08341; outline-offset:2px; }
.settings-option i {
  display:block; height:26px; border-radius:5px; border:1px solid #8e795a;
  background:linear-gradient(106deg,var(--swatch-base) 0 55%,var(--swatch-panel) 55% 80%,var(--swatch-accent,#d6aa61) 80%);
}
.settings-original { --swatch-base:#1d081f; --swatch-panel:#421c35; }
.settings-volume { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.settings-volume input { flex:1 1 130px; min-width:0; accent-color:#c89649; }
.settings-volume output { min-width:45px; text-align:end; font-variant-numeric:tabular-nums; }
.settings-volume button { padding:6px 14px; }
.settings-haptics { display:none; }

  #settingsView .settings-back { display:inline-flex; margin-block-end:10px; }
  .settings-haptics { display:block; }

.settings-preview {
  margin-block-start:16px; overflow:hidden; border:1px solid var(--site-edge,#89614e);
  border-radius:10px; background:var(--site-bg,#1d081f); color:var(--site-heading,#ffe2a0);
}
.settings-preview header {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 12px; background:var(--site-surface,#421c35); color:var(--site-ink,#fff0d8);
}
.settings-preview header small { font-size:12px; }
.settings-preview-body { padding:clamp(10px,2vw,16px); }
.settings-preview-body > strong { display:block; margin-block-end:8px; }
.settings-preview-card {
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;
  padding:10px; border:1px solid var(--site-edge,#89614e); border-radius:8px;
  background:var(--site-surface,#421c35); color:var(--site-ink,#fff0d8);
}
.settings-preview-action {
  padding:5px 9px; border:1px solid #e0b370; border-radius:8px;
  color:#2d2116; background:linear-gradient(#fff1c1,#cca056);
}

@media (min-width:900px) {
  html body .deposit-layout .deposit-side > nav > :is(a,button) {
    display:flex; justify-content:center; align-items:center; gap:6px; text-align:center;
    min-height:38px; padding-inline:10px;
  }
  html body .deposit-layout .deposit-side :is(h2,nav h2) { text-align:center; }
}
@media (max-width:899px) {
  .member-mobile-services .member-download-tile { grid-column:1/-1; }

    grid-auto-flow:column; justify-content:center; align-items:center; gap:8px; min-height:44px;
  }
  .member-download-tile .account-tile-icon { width:24px; height:24px; padding:3px; }
}
