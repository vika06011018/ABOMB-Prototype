/* Scale the original compositions within the same responsive document. */
:root {
  --u: min(calc((100vw - 20px) / 1168), calc(1690px / 1168));
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --gold-text: #ffe478;
}
body { background: radial-gradient(ellipse at 50% 43%,#350128,#1c0029 72%,#18001e); }
.top { padding-top: var(--safe-top); }
.topline { height: max(45px,calc(48 * var(--u))); gap: calc(18 * var(--u)); }
.brand img { width: calc(133 * var(--u)); }
.primary-menu { flex: 1; justify-content: space-between; gap: 2px; border-left: 1px solid #a46b21; padding-left: calc(10 * var(--u)); }
.primary-menu button { position: relative; padding: calc(11 * var(--u)) calc(5 * var(--u)); font-size: calc(17 * var(--u)); }
.primary-menu button.selected::after { content: ""; position: absolute; inset: auto 0 0; height: 3px; background: radial-gradient(ellipse,#fff9b1,#ffa400 40%,transparent 75%); box-shadow: 0 4px 9px #ff9400; }
.top-actions { gap: calc(11 * var(--u)); }
.outline-gold { font-size: calc(15 * var(--u)); padding: calc(7 * var(--u)) calc(10 * var(--u)); color: #ffda47; }
.deposit-mini { background: linear-gradient(#551029,#330023); color:#ffdb64; }
.notification { color:#ffe64b; filter: drop-shadow(0 0 4px #f89c00); }
.notification .icon { width: calc(31 * var(--u)); height: calc(31 * var(--u)); fill: #ffcd23; }
.avatar-button { padding:0; border:0; background:none; }
.avatar { width:calc(39 * var(--u)); height:calc(39 * var(--u)); }
.hero { aspect-ratio:1168/332; border-radius:calc(29 * var(--u)); touch-action:pan-y; background:
    radial-gradient(ellipse at 45% 96%,#d20aff 0%,transparent 24%),
    radial-gradient(ellipse at 10% 28%,#5c0577,transparent 43%),
    radial-gradient(ellipse at 95% 38%,#470765,transparent 45%),
    repeating-linear-gradient(158deg,transparent 0 24%,#6e00a656 26%,transparent 29%),
    linear-gradient(120deg,#2e0053,#160026 67%,#480068); }
.hero::before {content:"";position:absolute;left:29%;right:-14%;bottom:-50%;height:70%;border-radius:50%;border-top:calc(5 * var(--u)) solid #af4bff;box-shadow:0 -4px 15px #9f19ff,0 -10px 25px #f030f9;transform:rotate(-11deg);pointer-events:none;}
.hero>picture { position:absolute; inset:0; }
.hero>picture .hero-art { position:absolute; left:4.8%; bottom:0; width:auto; height:99%; object-fit:contain; }
.hero-decor { position:absolute; width:auto; pointer-events:none; }
.d-hero-crown { bottom:0; right:0; height:45%; }
.d-dice { bottom:0; left:38%; height:43%; }
.m-streak,.m-chip,.mobile-title { display:none; }
.hero-copy { position:absolute; left:40%; top:18%; right:9%; text-align:center; }
.hero-copy h1 { color:#ffd249; background:linear-gradient(#fffdf0 31%,#ffe94e 54%,#ffa000 90%); background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 5px #f4533c); margin:0; font:900 italic calc(56 * var(--u))/1.12 'Noto Serif CJK TC',serif; letter-spacing:.045em; white-space:nowrap; }
